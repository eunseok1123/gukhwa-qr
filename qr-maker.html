<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f8f3">
    <title>국화 품종 QR</title>
    <style>
      :root { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #17331f; background: #f5f8f3; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 40px 18px 72px; }
      main { width: min(1040px, 100%); margin: 0 auto; }
      a { color: #17623d; text-underline-offset: 3px; }
      h1 { margin: 18px 0 12px; font-size: clamp(2rem, 7vw, 4.5rem); line-height: 1; letter-spacing: -0.055em; }
      a:focus-visible { outline: 3px solid #22a2b2; outline-offset: 3px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 34px; }
      .qr-card { padding: 20px; border: 1px solid rgb(24 66 37 / 12%); border-radius: 20px; background: #fff; text-align: center; box-shadow: 0 14px 40px rgb(30 72 39 / 8%); }
      canvas { display: block; width: 100% !important; height: auto !important; }
      .qr-card h2 { margin: 16px 0 0; font-size: 1.1rem; }
      @media print { body { padding: 0; background: #fff; } .back { display: none; } .grid { grid-template-columns: repeat(2, 1fr); } .qr-card { break-inside: avoid; box-shadow: none; } }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="./">← 품종 목록</a>
      <h1>국화 품종 QR</h1>
      <section id="qr-grid" class="grid" aria-label="품종별 QR 코드"></section>
    </main>

    <script type="module">
      import QRCode from "https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm";

      const varieties = [
        "마이윙",
        "마이시티",
        "마이엘프",
        "마이허밍",
        "마이티니",
        "마이허니",
        "마이써니"
      ];

      const grid = document.querySelector("#qr-grid");
      const base = new URL("./", window.location.href);

      async function showQRCodes() {
        for (const [index, name] of varieties.entries()) {
          const url = new URL(`${index + 1}/`, base).href;
          const card = document.createElement("article");
          card.className = "qr-card";
          const canvas = document.createElement("canvas");
          const title = document.createElement("h2");
          title.textContent = `${index + 1}. ${name}`;
          card.append(canvas, title);
          grid.append(card);

          await QRCode.toCanvas(canvas, url, {
            width: 720,
            margin: 3,
            errorCorrectionLevel: "H",
            color: { dark: "#102d23", light: "#ffffff" }
          });
        }
      }

      showQRCodes();
    </script>
  </body>
</html>
